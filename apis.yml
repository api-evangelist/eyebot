name: Eyebot
description: >-
  Eyebot is a health-technology company building automated, self-serve vision
  testing kiosks that generate precise eyeglass prescriptions in minutes without
  a traditional eye-doctor appointment. The company deploys robotic screening
  kiosks into retail environments — partnering with large retailers such as
  Walmart and Sam's Club — to make refractive vision care faster, cheaper, and
  more accessible. Founded by Matthias Hofmann (CEO) and Jack Moldave (CTO) with
  Chief Medical Officer Alex Martin OD FAAO, Eyebot raised a $20M Series A and is
  backed by General Catalyst, Ubiquity Ventures, Village Global, and the National
  Science Foundation. Eyebot is currently a hardware-and-retail company with no
  public developer program, API, or SDK surface; this profile tracks its identity
  in the API Evangelist network pending any future developer offering.
